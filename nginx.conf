server {
    listen 80;
    server_name 155.117.40.245;

    # -------------------------------------------------------------
    # 1. FRONTEND: Servir archivos estáticos (React/Vite)
    # -------------------------------------------------------------
    # Ajusta "/var/www/Pagina-administrable" a la ruta real de tu proyecto
    root /var/www/Pagina-administrable/frontend/dist;
    index index.html;

    # Compresión Gzip para mejorar velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Manejo de rutas SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------
    # 2. BACKEND: Proxy reverso para la API
    # -------------------------------------------------------------
    location /api {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------------
    # 3. UPLOADS: Servir imágenes subidas directamente
    # -------------------------------------------------------------
    # Esto evita que Node.js tenga que procesar la entrega de imágenes
    location /uploads {
        alias /var/www/Pagina-administrable/backend/uploads;
        try_files $uri =404;
    }

    # Alias adicional por si el frontend las pide con /api/uploads
    location /api/uploads {
        alias /var/www/Pagina-administrable/backend/uploads;
        try_files $uri =404;
    }
}
